<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="EEEMIAD — Engenharia Empírica Evolutiva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b3a4b"/>
    </linearGradient>
    <linearGradient id="cascade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#90caf9"/>
      <stop offset="0.5" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#a5d6a7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- three E's as a cascade -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#cascade)">
    <text x="60" y="150" font-size="120" letter-spacing="-4">E</text>
    <text x="150" y="150" font-size="120" letter-spacing="-4" opacity="0.85">E</text>
    <text x="240" y="150" font-size="120" letter-spacing="-4" opacity="0.7">E</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e3f2fd">
    <text x="60" y="200" font-size="22" letter-spacing="2">ENGENHARIA · EMPÍRICA · EVOLUTIVA</text>
    <text x="60" y="230" font-size="14" fill="#90caf9" letter-spacing="1">EEEMIAD — Metodologia de IA para Desenvolvimento · AI Methodology for Development</text>
  </g>

  <!-- hierarchy of truth cascade -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#0d1b2a">
    <g>
      <rect x="640" y="48" width="110" height="38" rx="8" fill="#90caf9"/>
      <text x="695" y="73" text-anchor="middle" font-weight="700">Plan</text>
    </g>
    <path d="M750 67 H780" stroke="#e3f2fd" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="784" y="48" width="110" height="38" rx="8" fill="#b3e5fc"/>
      <text x="839" y="73" text-anchor="middle" font-weight="700">ADR</text>
    </g>
    <path d="M894 67 H924" stroke="#e3f2fd" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="928" y="48" width="110" height="38" rx="8" fill="#ffe082"/>
      <text x="983" y="73" text-anchor="middle" font-weight="700">Spec</text>
    </g>
    <path d="M1038 67 H1068" stroke="#e3f2fd" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="1072" y="48" width="90" height="38" rx="8" fill="#a5d6a7"/>
      <text x="1117" y="73" text-anchor="middle" font-weight="700">Code</text>
    </g>
  </g>

  <!-- arc lifecycle -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e3f2fd">
    <path d="M660 160 Q 900 90 1140 160" stroke="#ffe082" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <circle cx="660" cy="160" r="7" fill="#90caf9"/>
    <circle cx="820" cy="118" r="7" fill="#b3e5fc"/>
    <circle cx="980" cy="118" r="7" fill="#ffe082"/>
    <circle cx="1140" cy="160" r="7" fill="#a5d6a7"/>
    <text x="660" y="188" text-anchor="middle">off</text>
    <text x="820" y="146" text-anchor="middle">shadow</text>
    <text x="980" y="146" text-anchor="middle">enforce</text>
    <text x="1140" y="188" text-anchor="middle">retired</text>
    <text x="900" y="222" text-anchor="middle" fill="#90caf9" letter-spacing="1">o arco · stub → mock → flag → teste → medição</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e3f2fd"/>
    </marker>
  </defs>
</svg>
